<!doctype html>
<html>
  <head>
    <title>jsPsychTimelineBart Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/jspsych@8"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@8/css/jspsych.css" />

    <!-- Styles are bundled into the script via --inject-style; no stylesheet to load. -->
    <script src="../dist/index.browser.js"></script>

    <!-- Load the published timeline package here, e.g. -->
    <!-- <script src="https://unpkg.com/@jspsych-timelines/bart"></script> -->
  </head>

  <body></body>
  <script>
    const jsPsych = initJsPsych({
      on_finish: () => jsPsych.data.displayData("json"),
    });
    
    // simple timeline using US dollar cash rewards
    const task = jsPsychTimelineBart.createTimeline(jsPsych, {
      max_pumps: 20,
      min_pumps: 1,
      num_blocks: 1, // number of blocks in the experiment
      trials_per_block: 3, // number of trials per block
      points_per_pump: 25, // each pump is worth 25 cents
      text: {
        pump_button: "Pump Balloon",
        collect_button: "Collect Cash",
        current_value_label: "Current Cash",
        total_points_label: "Total Cash",
        point_display_format: (points) => `$${(points / 100).toFixed(2)}`,
        total_points_format: (points) => `$${(points / 100).toFixed(2)}`,
        // adjustedAvgPumps is null when every balloon popped, so guard before formatting.
        result_summary: (totalPoints, popRate, adjustedAvgPumps) => `
<div class="jspsych-bart-instructions-container">
  <p>You earned a total of <strong>$${(totalPoints / 100).toFixed(2)}</strong>!</p>
  <p>You popped ${(popRate * 100).toFixed(0)}% of your balloons${
    adjustedAvgPumps === null
      ? ", and never cashed one out."
      : `, and pumped an average of ${adjustedAvgPumps.toFixed(1)} times on the ones you cashed out.`
  }</p>
  <p>Thanks for participating!</p>
</div>`
      }
    });

    jsPsych.run(task);
  </script>
</html>
