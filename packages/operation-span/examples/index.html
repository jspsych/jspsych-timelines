<!DOCTYPE html>
<html>
  <head>
    <title>Operation Span Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/jspsych@8"></script>
    <script src="../dist/index.browser.js"></script>
    <!-- Once published: <script src="https://unpkg.com/@jspsych-timelines/operation-span"></script> -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/jspsych@8/css/jspsych.css" />
  </head>

  <body></body>
  <script>
    const jsPsych = initJsPsych({
      on_finish: () => {
        // Display data
        jsPsych.data.displayData();

        // Calculate and display scores
        const scores = jsPsychTimelineOperationSpan.utils.scoring.getSummary(jsPsych.data.get());
        console.log("Operation Span Results:", scores);
      },
    });

    // Operation span with the defaults of the automated task (Unsworth et al., 2005).
    // For a shorter demo, reduce set sizes and practice:
    const task = jsPsychTimelineOperationSpan.createTimeline(jsPsych, {
      set_sizes: [2, 3],
      trials_per_condition: 2,
      practice_trials: 6,
      practice_storage_trials: 2,
      practice_combined_trials: 2,
    });

    jsPsych.run([task]);
  </script>
</html>
