<!DOCTYPE html>
<html>
  <head>
    <title>Serial Reaction Time Task Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/jspsych@8"></script>
    <script src="../dist/index.browser.js"></script>
    <!-- Once published: <script src="https://unpkg.com/@jspsych-timelines/serial-reaction-time"></script> -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/jspsych@8/css/jspsych.css" />
  </head>

  <body></body>
  <script>
    const jsPsych = initJsPsych({
      on_finish: () => {
        jsPsych.data.displayData();
        const scores = jsPsychTimelineSerialReactionTime.utils.scoring.getSummary(
          jsPsych.data.get()
        );
        console.log("SRTT Results:", scores);
      },
    });

    // Short demo: 4 blocks of 30 trials, with the random block at position 3.
    const task = jsPsychTimelineSerialReactionTime.createTimeline(jsPsych, {
      numPracticeTrials: 8,
      numBlocks: 4,
      trialsPerBlock: 30,
      randomBlockIndex: 3,
    });

    jsPsych.run([task]);
  </script>
</html>
