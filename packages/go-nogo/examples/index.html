<!DOCTYPE html>
<html>
  <head>
    <title>Go/No-go Task Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/jspsych@8"></script>
    <script src="../dist/index.browser.js"></script>
    <!-- Once published: <script src="https://unpkg.com/@jspsych-timelines/go-nogo"></script> -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/jspsych@8/css/jspsych.css" />
  </head>

  <body></body>
  <script>
    const jsPsych = initJsPsych({
      on_finish: () => {
        jsPsych.data.displayData();
        const scores = jsPsychTimelineGoNogo.utils.scoring.getSummary(jsPsych.data.get());
        console.log("Go/No-go Task Results:", scores);
      },
    });

    // The default task is 350 test trials; this is a short demo with ordering rules on the no-go trials.
    const task = jsPsychTimelineGoNogo.createTimeline(jsPsych, {
      practice_trials: 6,
      n_test_trials: 40,
      condition_proportions: { go: 0.8, nogo: 0.2 },
      sequence_constraints: { max_run: { nogo: 2 }, min_gap: { nogo: 3 } },
    });

    jsPsych.run([task]);
  </script>
</html>
