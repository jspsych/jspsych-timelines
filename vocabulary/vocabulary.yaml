- name: adaptive
  layer: procedure
  type: object
  absent_value: null
  definition: 'Adaptive or tracking procedure: anything whose next level depends on performance, incl. ascend-until-failure
    (R16). The value can be passed whole to a shared staircase helper.'
  granularity_note: null = not adaptive. A practice override replaces the whole bundle. Rows that set one field
    map to adaptive.<field>; rows that set the whole procedure, or a part with no field (reset scope, per-condition
    tracks), map to adaptive.
  fields:
  - name: procedure
    type: enum
    unit: null
    definition: The adaptive rule.
    values:
    - staircase_1up_1down
    - staircase_1up_2down
    - staircase_1up_3down
    - ascending_discontinue
    - quest
    - rt_based
  - name: start_level
    type: number
    unit: task unit
    definition: Starting level, in the task's own unit.
    values: null
  - name: step_size
    type: number | {up, down}
    unit: task unit
    definition: Step size, or separate up/down steps.
    values: null
  - name: target_accuracy
    type: number
    unit: proportion
    definition: Performance level the procedure converges on.
    values: null
  - name: bounds
    type: list
    unit: task unit
    definition: '[min, max] of the tracked level.'
    values: null
  - name: discontinue_rule
    type: structure
    unit: null
    definition: Rule that ends the procedure (reversals, consecutive failures, trial count).
    values: null
